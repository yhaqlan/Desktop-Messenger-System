[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-messenger-synced-lively"
version = "1.0.0"
description = "Academic offline/LAN/relay desktop messenger"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "cryptography>=42,<48",
]

[tool.setuptools.packages.find]
include = ["desktop_messenger*"]
